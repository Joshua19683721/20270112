<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英語自主學習</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1c2233; --ink2:#5a6478; --ink3:#8d97ab;
  --line:#e3e8f2; --brand:#4a5cf5; --brand2:#6d7bff; --brandsoft:#eef0ff;
  --ok:#12a06a; --oksoft:#e6f7ef; --bad:#e2453c; --badsoft:#fdeceb;
  --warn:#e08a00; --warnsoft:#fff6e5; --shadow:0 2px 10px rgba(28,34,51,.06);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}

/* ---------- header ---------- */
.hero{
  background:linear-gradient(135deg,#4a5cf5 0%,#7a5cf0 55%,#9a5ce8 100%);
  color:#fff;padding:22px 16px 26px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;
  border-radius:50%;background:rgba(255,255,255,.12);
}
.hero .in{max-width:860px;margin:0 auto;position:relative;z-index:1}
.hero h1{margin:0;font-size:22px;letter-spacing:.4px;font-weight:800}
.hero .sub{margin-top:5px;font-size:13px;opacity:.86}
.hero .stat{display:flex;gap:18px;margin-top:16px;font-size:12.5px}
.hero .stat b{display:block;font-size:19px;font-weight:800;line-height:1.25}

/* ---------- generic ---------- */
.sec-title{display:flex;align-items:center;gap:8px;margin:26px 0 12px;font-size:15px;font-weight:800}
.sec-title small{font-weight:500;color:var(--ink3);font-size:12.5px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.muted{color:var(--ink2)}
.tiny{font-size:12.5px;color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:11px;background:var(--brand);color:#fff;
  font-weight:700;font-size:14px;transition:.15s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft{background:var(--brandsoft);color:var(--brand)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- lesson grid ---------- */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.lcard{
  background:#fff;border-radius:14px;padding:14px 14px 12px;box-shadow:var(--shadow);
  border-left:4px solid var(--brand);position:relative;transition:.15s;text-align:left;width:100%;
}
.lcard:active{transform:scale(.985)}
.lcard .no{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.5px}
.lcard .tt{font-size:15px;font-weight:800;margin-top:2px;line-height:1.35}
.lcard .en{font-size:12px;color:var(--ink3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .bar{height:5px;border-radius:3px;background:#eef1f8;margin-top:10px;overflow:hidden}
.lcard .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#4a5cf5,#9a5ce8)}
.lcard .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:6px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;position:sticky;top:0;background:var(--bg);z-index:20}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:8px 15px;border-radius:11px;background:#fff;color:var(--ink2);
  font-weight:700;font-size:13.5px;box-shadow:var(--shadow);white-space:nowrap;
}
.tab.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(74,92,245,.3)}

/* ---------- word card ---------- */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.wcard{
  background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;transition:.15s;
}
.wcard .ph{height:96px;background:#f7f8fd;display:flex;align-items:center;justify-content:center;padding:8px}
.wcard .ph img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.wcard .ph .ini{width:58px;height:58px;border-radius:50%;background:#eef1fa;color:#9aa6c8;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.wcard .bd{padding:9px 11px 11px}
.wcard .w{font-size:16.5px;font-weight:800;letter-spacing:.2px}
.wcard .zh{font-size:12.5px;color:var(--ink2);margin-top:1px}
.wcard .spk{
  position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.92);box-shadow:var(--shadow);display:flex;
  align-items:center;justify-content:center;font-size:14px;
}
.wcard .rel{position:relative}

/* ---------- sentence / phonics card ---------- */
.scard{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:13px 15px;margin-bottom:10px}
.scard .en{font-size:15.5px;font-weight:700;line-height:1.55;letter-spacing:.2px}
.scard .zh{font-size:13px;color:var(--ink2);margin-top:4px}
.scard .tag{
  display:inline-block;font-size:11px;font-weight:800;color:var(--brand);
  background:var(--brandsoft);padding:2px 8px;border-radius:6px;margin-bottom:6px;
}
.pcard{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px}
.pcard .pat{font-size:19px;font-weight:800;color:var(--brand);letter-spacing:.5px}
.pcard .exs{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.pcard .ex{
  background:#f4f6fb;border-radius:9px;padding:5px 11px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.pcard .ex:active{background:var(--brandsoft)}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qbar{height:6px;border-radius:3px;background:#e7ebf5;flex:1;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#4a5cf5,#9a5ce8);transition:.3s}
.qbody{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.qsec{font-size:11.5px;font-weight:800;color:var(--brand);background:var(--brandsoft);
  display:inline-block;padding:3px 9px;border-radius:7px;margin-bottom:10px}
.qstem{font-size:16px;line-height:1.75;font-weight:600;letter-spacing:.2px;white-space:pre-wrap}
.qstem .bl{display:inline-block;min-width:62px;border-bottom:2px solid var(--brand);text-align:center;color:var(--brand);font-weight:800}
.qimg{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px;justify-content:center}
.qimg img{max-height:150px;max-width:100%;object-fit:contain;border-radius:10px;background:#f7f8fd;padding:6px}
.qimg.big img{max-height:330px;padding:8px;background:#fff;border:1px solid var(--line)}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:#fff;border:1.8px solid var(--line);border-radius:12px;
  padding:11px 14px;margin-top:9px;font-size:15px;font-weight:600;transition:.13s;
}
.opt:active{transform:scale(.99)}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f0f2f9;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;
}
.opt.picopt{flex-direction:column;gap:6px;padding:8px;width:auto;flex:1 1 30%}
.opt.picopt img{max-height:96px;max-width:100%;object-fit:contain}
.opt.picopt .k{align-self:flex-start}
.opt.on{border-color:var(--brand);background:var(--brandsoft)}
.opt.ok{border-color:var(--ok);background:var(--oksoft)}
.opt.bad{border-color:var(--bad);background:var(--badsoft)}
.opt[disabled]{cursor:default}
.picrow{display:flex;gap:9px;flex-wrap:wrap}

.oxrow{display:flex;gap:12px;margin-top:14px}
.oxrow .opt{justify-content:center;font-size:22px;font-weight:800;padding:16px}

.bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.bank .chip{
  background:var(--warnsoft);color:#8a5a00;border-radius:9px;padding:6px 12px;
  font-weight:700;font-size:14px;border:1.5px solid #ffe2ab;
}
.tokwrap{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tok{background:#fff;border:1.8px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px}
.tok.used{opacity:.28;pointer-events:none}
.typein{
  width:100%;padding:12px 14px;border:1.8px solid var(--line);border-radius:12px;
  font-size:16px;font-weight:600;margin-top:12px;background:#fff;outline:none;
}
.typein:focus{border-color:var(--brand);background:#fbfbff}
.typein.ok{border-color:var(--ok);background:var(--oksoft)}
.typein.bad{border-color:var(--bad);background:var(--badsoft)}
.multi{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mline{font-size:15.5px;font-weight:600;line-height:2.75;word-break:break-word}
.mline input{
  width:118px;padding:3px 8px;border:0;border-bottom:2px solid var(--brand);
  background:transparent;font-size:15.5px;font-weight:700;outline:none;
  text-align:center;color:var(--brand);margin:0 3px;
}
.mline input.ok{color:var(--ok);border-color:var(--ok)}
.mline input.bad{color:var(--bad);border-color:var(--bad)}
.showline{font-size:16.5px;font-weight:600;line-height:2.75;margin-top:10px;word-break:break-word}
.showline .bl{display:inline-block;min-width:88px;border-bottom:2px solid var(--brand);
  vertical-align:-2px;margin:0 3px}
.passage .bk{color:var(--brand);font-weight:800;background:var(--brandsoft);
  border-radius:5px;padding:0 4px}

.fb{margin-top:14px;border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.7}
.fb.ok{background:var(--oksoft);color:#0a6b47}
.fb.bad{background:var(--badsoft);color:#a82b23}
.fb .h{font-weight:800;font-size:14.5px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.fb .ans{font-weight:800;color:var(--ok)}
.fb .ex{margin-top:6px;color:var(--ink2);font-size:13.5px;border-top:1px dashed rgba(0,0,0,.1);padding-top:6px}
.qfoot{display:flex;gap:10px;margin-top:16px}
.qfoot .btn{flex:1;padding:13px}
.playbar{
  display:flex;align-items:center;gap:10px;background:#f4f6fb;border-radius:12px;
  padding:9px 12px;margin-bottom:12px;
}
.playbar .pb{
  width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 40px;
}
.playbar .pb.playing{background:var(--ok)}
.playbar .txt{font-size:13px;color:var(--ink2);font-weight:600}

.passage{background:#f7f8fd;border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.8;
  margin-bottom:14px;white-space:pre-wrap;font-weight:500}
.subq{border-top:1px dashed var(--line);padding-top:14px;margin-top:14px}
.subq .n{font-weight:800;color:var(--brand);font-size:13px;margin-bottom:4px}

/* ---------- 課文頁 ---------- */
.pgcard{background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.pgcard .hd{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line)}
.pgcard .hd .pn{font-size:12.5px;font-weight:800;color:var(--brand);background:var(--brandsoft);
  padding:2px 9px;border-radius:7px}
.pgcard .hd .tt{font-size:12.5px;color:var(--ink3);font-weight:600}
.pgcard .hd .pb{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--brand);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 32px}
.pgcard .hd .pb.playing{background:var(--ok)}
.pgcard img{display:block;width:100%;height:auto;cursor:zoom-in;background:#fff}

/* ---------- 素養卡 ---------- */
.culcard{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:16px 17px;margin-bottom:12px;
  border-top:4px solid #e08a00}
.culcard .h{font-size:15.5px;font-weight:800;line-height:1.45;color:#8a5a00}
.culcard .zh{font-size:13px;color:var(--ink2);margin-top:6px;font-weight:600}
.culcard .bd{font-size:14px;line-height:1.85;margin-top:10px;color:var(--ink)}
.culcard .kv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.culcard .kv .r{display:flex;gap:9px;padding:5px 0;font-size:13.5px;align-items:baseline}
.culcard .kv .r b{flex:0 0 auto;font-weight:800;color:#8a5a00;min-width:112px}
.culcard .kv .r span{color:var(--ink2)}
.culcard .ask{margin-top:12px;background:var(--warnsoft);border-radius:11px;padding:11px 13px;
  font-size:13.5px;line-height:1.8;color:#7a5000}

/* ---------- 句型提醒 ---------- */
.scard .note{margin-top:8px;font-size:12.8px;line-height:1.75;color:#8a5a00;
  background:var(--warnsoft);border-radius:9px;padding:8px 11px}
.scard .note.warn{background:var(--badsoft);color:#a82b23}

/* ---------- 拼讀分組 ---------- */
.pcard .rule{font-size:12.8px;color:var(--ink2);line-height:1.8;margin-top:7px}
.pcard .grp{margin-top:10px}
.pcard .grp .lb{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.3px;margin-bottom:6px}
.pcard .grp .lb.long{color:#0a6b47}
.pcard .pair{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;
  font-size:14px;font-weight:700}
.pcard .pair .ar{color:var(--ink3);font-weight:600;font-size:12.5px}

/* ---------- 圖片放大 ---------- */
.lightbox{position:fixed;inset:0;background:rgba(12,16,26,.92);z-index:80;display:flex;
  align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}

/* ---------- 題目來源徽章 ---------- */
.srcbadge{display:inline-block;font-size:10.5px;font-weight:800;color:#0a6b47;background:var(--oksoft);
  padding:2px 7px;border-radius:6px;margin-left:7px;vertical-align:1px}
.allbar{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:15px 17px;margin-top:12px}
.allbar .t{font-size:14.5px;font-weight:800}
.allbar .d{font-size:12.5px;color:var(--ink3);margin-top:3px}

/* ---------- result ---------- */
.score{text-align:center;padding:26px 16px}
.score .big{font-size:56px;font-weight:800;line-height:1;background:linear-gradient(135deg,#4a5cf5,#9a5ce8);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.score .lbl{font-size:14px;color:var(--ink2);margin-top:8px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chipst{background:#fff;border-radius:11px;padding:9px 14px;box-shadow:var(--shadow);font-size:13px;font-weight:700}
.chipst b{font-size:17px;display:block;color:var(--brand)}

/* ---------- wrong book ---------- */
.wrow{background:#fff;border-radius:13px;box-shadow:var(--shadow);padding:13px 15px;margin-bottom:10px}
.wrow .q{font-size:14.5px;font-weight:600;line-height:1.6}
.wrow .m{font-size:12px;color:var(--ink3);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.wrow .m b{color:var(--bad);font-weight:800}
.wrow .m i{color:var(--ok);font-style:normal;font-weight:800}
.empty{text-align:center;padding:50px 20px;color:var(--ink3)}
.empty .e{font-size:38px;margin-bottom:10px;opacity:.5}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;
  background:#1c2233;color:#fff;padding:10px 20px;border-radius:11px;font-size:13.5px;
  font-weight:600;pointer-events:none;transition:.25s;z-index:99;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- back ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 0 2px}
.back{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;color:var(--brand)}
.topbar .h{font-size:16px;font-weight:800}

@media(max-width:560px){
  .hero h1{font-size:19px}
  .lgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .wgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .qstem{font-size:15px}
  .opt{font-size:14.5px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>/*__CONTENT__*/</script>
<script>/*__ASSETS__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
