<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7fb;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#17263a;line-height:1.8}
.box{max-width:520px;padding:32px;background:#fff;border-radius:16px;box-shadow:0 8px 26px rgba(28,58,100,.12);text-align:center}
h1{font-size:20px;margin:0 0 12px}

a{color:#2b5fa8}

<script id="site-pass-gate-init">(function(){try{var u=parseInt(localStorage.getItem('site_pass_until'),10);if(!u||Date.now()>=u){document.documentElement.classList.add('site-pass-locked');}}catch(e){document.documentElement.classList.add('site-pass-locked');}})();</script>
<style id="site-pass-gate-style">html.site-pass-locked{overflow:hidden}html.site-pass-locked body>:not(.site-pass-gate){display:none!important}.site-pass-gate{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 20%,#294f83 0,#111d2f 65%);color:#fff;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",system-ui,sans-serif}html:not(.site-pass-locked) .site-pass-gate{display:none!important}.site-pass-card{width:min(100%,430px);padding:34px 30px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:rgba(18,32,53,.92);box-shadow:0 26px 70px rgba(0,0,0,.4);text-align:center;backdrop-filter:blur(12px)}.site-pass-mark{width:74px;height:74px;margin:0 auto 18px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffbd45,#f06d3a);font-size:38px;box-shadow:0 8px 26px rgba(240,109,58,.35)}.site-pass-card h1{margin:0 0 8px;font-size:23px;letter-spacing:.04em}.site-pass-card p{margin:0 0 18px;color:#b9c9dc;font-size:14px;line-height:1.7}.site-pass-field{display:flex;gap:8px}.site-pass-input{flex:1;min-width:0;height:50px;border:2px solid transparent;border-radius:12px;padding:0 14px;background:#f8fafc;color:#17263a;font-size:22px;font-weight:800;letter-spacing:.35em;text-align:center;outline:none}.site-pass-input:focus{border-color:#ffbd45;box-shadow:0 0 0 4px rgba(255,189,69,.18)}.site-pass-button{height:50px;border:0;border-radius:12px;padding:0 20px;background:#ffbd45;color:#3a2300;font-size:17px;font-weight:900;cursor:pointer}.site-pass-button:hover{filter:brightness(1.05)}.site-pass-error{min-height:22px;margin:9px 2px 0;color:#ffb0a3;font-size:13px;font-weight:700}.site-pass-foot{margin-top:12px;color:#7185a0;font-size:11px}.site-pass-card button:focus-visible,.site-pass-card input:focus-visible{outline:3px solid #7dd3fc;outline-offset:2px}@media(max-width:470px){.site-pass-field{flex-direction:column}.site-pass-input,.site-pass-button{width:100%}}</style>
</head>
<body>
<div class="site-pass-gate" id="site-pass-gate" role="dialog" aria-modal="true" aria-labelledby="site-pass-title"><form class="site-pass-card" id="site-pass-form"><div class="site-pass-mark" aria-hidden="true">🔑</div><h1 id="site-pass-title">請輸入通行碼</h1><p>這個自主學習網站僅供登記使用。<br>請輸入通行碼後進入。</p><label class="site-pass-field"><span class="sr-only" style="position:absolute;left:-10000px">通行碼</span><input class="site-pass-input" id="site-pass-input" name="code" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="12" pattern="[0-9]*" autofocus aria-describedby="site-pass-error"><button class="site-pass-button" type="submit">進入</button></label><div class="site-pass-error" id="site-pass-error" aria-live="polite"></div><div class="site-pass-foot">輸入成功後，本機 30 天內免重輸。</div></form></div>
<script id="site-pass-gate-script">(function(){var key='site_pass_until',hash;function h(s){var x=2166136261>>>0;for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);x>>>=0}return ('00000000'+x.toString(16)).slice(-8)}var form=document.getElementById('site-pass-form'),input=document.getElementById('site-pass-input'),error=document.getElementById('site-pass-error');if(!form||!input||!error){document.documentElement.classList.add('site-pass-locked');return}form.addEventListener('submit',function(ev){ev.preventDefault();var value=input.value.trim().replace(/\s/g,'');if(h(value)==='00c6664d'){try{localStorage.setItem(key,String(Date.now()+2592000000))}catch(e){}document.documentElement.classList.remove('site-pass-locked');error.textContent='';}else{error.textContent='通行碼不正確，請再試一次。';input.select();}});try{var saved=parseInt(localStorage.getItem(key),10);if(saved&&Date.now()<saved){document.documentElement.classList.remove('site-pass-locked')}}catch(e){}})();</script>

<div class="box">
<h1>數學課程已擴充為全冊</h1>
